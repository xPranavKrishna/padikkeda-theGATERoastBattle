<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#070a0f" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="flameOuter" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="flameInner" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="60%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="16" fill="#070c14"/>
  <rect width="64" height="64" rx="16" fill="url(#bgGlow)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Flame Core (Stylized Cyber Flame) -->
  <g filter="url(#glow)">
    <path d="M32 8 C34 16, 42 20, 44 28 C46 36, 41 45, 34 50 C46 47, 50 37, 48 30 C47 27, 44 24, 44 20 C40 23, 38 21, 37 18 C36 14, 34 10, 32 8 Z" fill="url(#flameOuter)" opacity="0.85"/>
    <path d="M32 8 C30 15, 23 20, 20 27 C16 36, 20 46, 28 51 C20 48, 15 39, 17 31 C18 28, 20 25, 21 21 C24 24, 27 22, 28 18 C29 14, 31 10, 32 8 Z" fill="url(#flameOuter)" opacity="0.95"/>
    <path d="M32 10 C36 18, 46 25, 45 36 C44 47, 34 54, 25 51 C35 50, 40 42, 38 35 C37 30, 33 27, 34 21 C33 23, 31 25, 29 23 C26 21, 28 17, 32 10 Z" fill="url(#flameOuter)"/>
    <path d="M32 24 C34 29, 39 34, 38 41 C37 47, 31 51, 26 48 C32 47, 35 42, 34 38 C33 34, 30 32, 31 28 C30 30, 28 31, 27 29 C26 27, 28 25, 32 24 Z" fill="url(#flameInner)"/>
  </g>

  <!-- Sparkle Particles -->
  <circle cx="47" cy="17" r="2" fill="#38bdf8"/>
  <circle cx="17" cy="22" r="1.5" fill="#fbbf24"/>
</svg>
